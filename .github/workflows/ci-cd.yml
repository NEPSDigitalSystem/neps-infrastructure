name: NEPS Infrastructure CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci-test

    steps:
      - uses: actions/checkout@v4

      - name: Create CI stubs (secrets, configs, dirs)
        run: |
          # Secrets
          mkdir -p secrets
          echo "neps" > secrets/postgres_user.txt
          echo "ci_password" > secrets/postgres_password.txt
          echo "ci_secret_key_32chars_minimum___" > secrets/app_secret_key.txt
          echo "ci_redcap_token" > secrets/redcap_api_token.txt
          echo "https://discord.com/api/webhooks/0/placeholder" > secrets/discord_webhook_url.txt
          echo "ci_smtp_password" > secrets/smtp_password.txt

          # Monitoring configs (all referenced by docker-compose.yml)
          mkdir -p monitoring/rules
          mkdir -p monitoring/grafana/provisioning/dashboards
          mkdir -p monitoring/grafana/provisioning/datasources
          mkdir -p monitoring/ofelia
          touch monitoring/prometheus.yml
          touch monitoring/alertmanager.yml
          touch monitoring/loki-config.yml
          touch monitoring/promtail-config.yml
          touch monitoring/blackbox.yml
          touch monitoring/ofelia/config.ini

          # Other referenced dirs/files
          mkdir -p scripts
          touch scripts/backup.sh
          echo '#!/bin/bash' > scripts/backup.sh
          chmod +x scripts/backup.sh

          mkdir -p backups/minio
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/privkey.pem \
            -out nginx/ssl/fullchain.pem \
            -subj "/CN=localhost"
          cp nginx/ssl/privkey.pem nginx/ssl/neps.key
          cp nginx/ssl/fullchain.pem nginx/ssl/neps.crt

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config --quiet

          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          fi

          if [ -f docker-compose.institutional-tls.yml ]; then
            echo "ci_knust_cert" > secrets/knust_cert.pem
            echo "ci_knust_key" > secrets/knust_key.pem
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.institutional-tls.yml config --quiet
          fi

          # Validate staging overlay (stack must compose cleanly on staging deploys)
          if [ -f docker-compose.staging.yml ]; then
            echo "ci_redcap_token_staging" > secrets/redcap_api_token_staging.txt 2>/dev/null || true
            echo "https://discord.com/api/webhooks/0/staging" > secrets/discord_webhook_url_staging.txt 2>/dev/null || true
            touch monitoring/alertmanager.staging.yml 2>/dev/null || true
            touch monitoring/ofelia/config.staging.ini 2>/dev/null || true
            touch nginx/staging-nginx.conf 2>/dev/null || true
            COMPOSE_PROJECT_NAME=neps-staging \
            docker compose -f docker-compose.yml \
                          -f docker-compose.prod.yml \
                          -f docker-compose.staging.yml \
                          config --quiet
          fi

      - name: Validate Nginx Syntax
        run: |
          if [ -f nginx/nginx.conf ]; then
            docker run --rm \
              -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v $(pwd)/nginx/ssl:/etc/nginx/ssl:ro \
              nginx:alpine nginx -t
            echo "✓ Nginx SSL configuration syntax validated"
          fi


      - name: Check Scripts
        run: |
          if [ -d "scripts" ]; then
            for script in scripts/*.sh; do
              if [ -f "$script" ]; then
                bash -n "$script"
                head -n1 "$script" | grep -qE '#!/bin/(bash|sh)' || (echo "Missing shebang in $script" && exit 1)
              fi
            done
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip secret scan on Dependabot PRs (permission issues with diff scanning)
      - name: Secret Scan (PR — diff only)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: trufflesecurity/trufflehog@v3.95.6
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Secret Scan (Push — full repo)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.95.6
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

      # FIXED: Pinned trivy-action to v0.36.0 (was @master, which was compromised)
      - name: Container Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    needs: [validate, security]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push' && vars.STAGING_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy full stack to STAGING server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/neps-infrastructure
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure staging-specific secret stubs exist the first time this runs.
            # Replace placeholder values with real staging secrets via `docker compose config` after.
            mkdir -p secrets backups/staging-minio
            [ -f secrets/discord_webhook_url_staging.txt ] || \
              echo "https://discord.com/api/webhooks/REPLACE_ME_STAGING" > secrets/discord_webhook_url_staging.txt

            export COMPOSE_PROJECT_NAME=neps-staging
            export IMAGE_TAG=staging
            docker compose -f docker-compose.yml \
                          -f docker-compose.prod.yml \
                          -f docker-compose.staging.yml \
                          pull
            docker compose -f docker-compose.yml \
                          -f docker-compose.prod.yml \
                          -f docker-compose.staging.yml \
                          up -d
            docker image prune -f
            echo "Staging full-stack deployed at $(date) — ${IMAGE_TAG}"
            echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ"),neps-infrastructure,staging,${IMAGE_TAG}" >> .deployment-history

  deploy:
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy full stack to PRODUCTION server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/neps-infrastructure
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export COMPOSE_PROJECT_NAME=neps-infrastructure
            export IMAGE_TAG=latest
            docker compose -f docker-compose.yml \
                          -f docker-compose.prod.yml \
                          pull
            docker compose -f docker-compose.yml \
                          -f docker-compose.prod.yml \
                          up -d
            docker image prune -f
            echo "Production full-stack deployed at $(date) — ${IMAGE_TAG}"
            echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ"),neps-infrastructure,production,${IMAGE_TAG}" >> .deployment-history
