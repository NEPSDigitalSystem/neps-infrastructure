events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  staging_fmt  '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" | STAGING';
    access_log  /var/log/nginx/access.log  staging_fmt;

    upstream portal {
        server neps-portal:3000;
    }

    upstream backend {
        server neps-backend:8000;
    }

    upstream ml {
        server neps-ml-ai:8000;
    }

    upstream data_platform {
        server neps-data-platform:8000;
    }

    # ── HTTP on staging port 18080 ──────────────────────────────────────────
    # Staging intentionally binds 18080 + 18443 (non-privileged) so production
    # nginx can own the real :80 / :443 on the same host. If on a dedicated
    # staging VM these can be changed to 80/443 after reconfiguring the
    # compose overlay ports.
    server {
        listen 80;
        server_name localhost;

        # Hard security headers (staging mirrors prod policy)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-NEPS-Environment "staging" always;
        add_header Content-Security-Policy "default-src 'self' http://localhost:13000 http://localhost:18000; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:13000 http://localhost:18000 http://localhost:18001;" always;

        # Prominent staging banner returned as an extra response header
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Frontend (portal runs on container port 3000)
        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:18080;
        }

        # Backend API
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ML/AI service
        location /ml/ {
            rewrite ^/ml/(.*)$ /$1 break;
            proxy_pass http://ml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Data-platform ETL status endpoint
        location /etl/ {
            rewrite ^/etl/(.*)$ /$1 break;
            proxy_pass http://data_platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health (routes to backend /health)
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
    }

    # ── HTTPS on staging port 18443 ─────────────────────────────────────────
    # Uses the same self-signed cert pair as local-dev/prod overlay. Replace
    # with institutional/Let's Encrypt cert pair once staging DNS is live.
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/neps.crt;
        ssl_certificate_key /etc/nginx/ssl/neps.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Mirrors the HTTP server config above
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-NEPS-Environment "staging" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:18443;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ml/ {
            rewrite ^/ml/(.*)$ /$1 break;
            proxy_pass http://ml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend;
            access_log off;
        }
    }
}
