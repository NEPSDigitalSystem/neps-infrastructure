global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@neps.digital'
  smtp_auth_username: 'alerts@neps.digital'
  smtp_auth_password_file: '/run/secrets/smtp_password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'production-alerts'

  routes:
    # Safeguarding critical alerts — notify immediately
    - matchers:
        - severity="critical"
        - team="safeguarding"
      group_wait: 0s
      receiver: 'safeguarding-immediate'

    - matchers:
        - severity="critical"
      receiver: 'production-alerts'

    - matchers:
        - severity="warning"
      receiver: 'production-alerts'

receivers:
  - name: 'production-alerts'
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        username: 'NEPS Alerts'
    email_configs:
      - to: 'devops@neps.digital'
        send_resolved: true

  - name: 'safeguarding-immediate'
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        username: 'NEPS Safeguarding On-Call'
        title: '🚨 CRISIS SAFEGUARDING ALERT: {{ .GroupLabels.alertname }}'
    email_configs:
      - to: 'safeguarding-oncall@neps.digital'
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'job']
