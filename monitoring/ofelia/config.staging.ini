; ─────────────────────────────────────────────────────────────────────────────
; Ofelia scheduler — STAGING configuration.
;
; CRITICAL DIFFERENCE FROM PROD (config.ini):
;   Ofelia looks up containers by their resolved Docker name. In staging,
;   COMPOSE_PROJECT_NAME = neps-staging, so every container name becomes
;   `neps-staging-<service>-1` instead of the prod `neps-infrastructure-<svc>-1`.
;   We MUST use the staging-prefixed names here or the jobs silently never fire.
;
; Staging host ports for quick smoke-test verification after cron fires:
;   Backend health: http://<host>:18000/health
;   Data-platform sync log: `docker logs neps-staging-neps-data-platform-1`
;   PgAdmin backup dir: /opt/neps-infrastructure/backups/staging-postgres/
; ─────────────────────────────────────────────────────────────────────────────

[global]
docker-host = unix:///var/run/docker.sock
save-folder = /var/log/ofelia
log-level = INFO

; ─── Job 1: Nightly ETL full sync (01:00 UTC = 03:00 Accra) ────────────────
; Reaches into the sleeping staging data-platform container and runs a full
; REDCap → Postgres ETL. Log line for success is:
;   `INFO:etl.orchestrator:Full sync completed — 150 participants, 3600 reports`
[job-exec "staging-data-platform-etl-nightly"]
schedule = 0 0 1 * * *
container = neps-staging-neps-data-platform-1
command = sh -c "export DATABASE_URL=postgresql://neps:$(cat /run/secrets/postgres_password)@postgres:5432/neps_db && python -m etl.main sync --full"
no-overlap = true
save-folder = /var/log/ofelia/staging-etl
mail-on-error = false

; ─── Job 2: Nightly PITR base backup (02:00 UTC) ────────────────────────────
; Creates a full base snapshot inside staging's own wal-archive-staging volume
; (separate from the prod base archive) so staging PITR restore drills don't
; touch production backup artifacts.
[job-exec "staging-postgres-pitr-nightly-basebackup"]
schedule = 0 0 2 * * *
container = neps-staging-postgres-1
command = sh -c "pg_basebackup -U neps -D /backup/pitr/base/$(date +%Y%m%d-%H%M%S) -Ft -z -Xs -P"
no-overlap = true
save-folder = /var/log/ofelia/staging-pitr
mail-on-error = false

; ─── Job 3: Half-hourly backend health probe ────────────────────────────────
; Cheap uptime heartbeats from inside the Docker daemon; failure appears as
; an Ofelia job error log. For monitoring metrics we rely on Prometheus
; blackbox-exporter; this job is a belt-and-suspenders check that restarts a
; truly hung backend container.
[job-exec "staging-backend-health-probe"]
schedule = @every 30m
container = neps-staging-neps-backend-1
command = python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"
no-overlap = true
save-folder = /var/log/ofelia/staging-health
mail-on-error = false
kill-on-error = true

; ─── Job 4: Daytime smoke test for safeguarding alert routing (10:00 UTC) ──
; Fires a synthetic Prometheus alert into staging Alertmanager so the DevOps
; team can confirm Discord staging-webhook reaches the #staging-alerts channel
; every morning. Produces a non-critical informational alert that auto-resolves.
[job-run "staging-alertmanager-daily-smoketest"]
schedule = 0 0 10 * * *
image = curlimages/curl:latest
network = neps-staging_neps-internal
volume = /var/log/ofelia/staging-alerts:/var/log
command = >
  curl -s -X POST http://alertmanager:9093/api/v2/alerts
       -H "Content-Type: application/json"
       -d '[{"labels":{"alertname":"StagingDailySmokeTest","severity":"info","service":"alertmanager"},"annotations":{"summary":"Staging alert-routing daily smoke test — expected safe test alert.","runbook_url":"http://localhost:19090"}}]'
no-overlap = true
save-folder = /var/log/ofelia/staging-alerts
